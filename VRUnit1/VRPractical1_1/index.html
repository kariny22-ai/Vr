<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <!-- Challenge
    Add an asset manager that preloads images for the ids below which are being referenced throughout the VR world.
IDs: spiderskin, rock, spidereye, cave, and bk          
-->
  <body>
  <a-scene>

  <!-- Ground -->
      <a-plane position="0 0 -4"
               rotation="-90 0 0"
               width="100"
               height="100"
               color="#7BC8A4">
      </a-plane>

      <a-sky src="R.jpg"></a-sky>

      <a-entity position="-8 0.5 -5" rotation="0 0 0">

        
        <a-box position="0 1 0"
               width="4" height="1" depth="2"
               color="red">
        </a-box>

        
        <a-box position="0 1.8 0"
               width="2.2" height="0.8" depth="1.6"
               color="white">
        </a-box>

        
        <a-cylinder position="-1.3 0.5 1"
                    radius="0.5" height="0.3"
                    rotation="90 0 0" color="black">
        </a-cylinder>

        <a-cylinder position="1.3 0.5 1"
                    radius="0.5" height="0.3"
                    rotation="90 0 0" color="black">
        </a-cylinder>

        <a-cylinder position="-1.3 0.5 -1"
                    radius="0.5" height="0.3"
                    rotation="90 0 0" color="black">
        </a-cylinder>

        <a-cylinder position="1.3 0.5 -1"
                    radius="0.5" height="0.3"
                    rotation="90 0 0" color="black">
        </a-cylinder>
      </a-entity>

      
      <a-entity position="0 0.5 -5" rotation="0 90 0">
        <a-box position="0 1 0" width="4" height="1" depth="2" color="blue"></a-box>
        <a-box position="0 1.8 0" width="2.2" height="0.8" depth="1.6" color="white"></a-box>

        <a-cylinder position="-1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="-1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
      </a-entity>

     
      <a-entity position="8 0.5 -5" rotation="0 180 0">
        <a-box position="0 1 0" width="4" height="1" depth="2" color="yellow"></a-box>
        <a-box position="0 1.8 0" width="2.2" height="0.8" depth="1.6" color="white"></a-box>

        <a-cylinder position="-1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="-1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
      </a-entity>

      
      <a-entity position="0 0.5 5" rotation="0 -90 0">
        <a-box position="0 1 0" width="4" height="1" depth="2" color="green"></a-box>
        <a-box position="0 1.8 0" width="2.2" height="0.8" depth="1.6" color="white"></a-box>

        <a-cylinder position="-1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="-1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
        <a-cylinder position="1.3 0.5 -1" radius="0.5" height="0.3" rotation="90 0 0" color="black"></a-cylinder>
      </a-entity>

    
      <a-camera position="0 4 15"></a-camera>

    </a-scene>
  </body>
</html>
